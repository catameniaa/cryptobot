name: Crypto Dashboard Scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bagimlilik Yukle
        run: pip install ccxt pandas numpy requests

      - name: Scanner Calistir
        run: |
          cd scanner
          python backtest_perp_scanner.py --mode dashboard --limit 100
        continue-on-error: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./scanner
          publish_branch: gh-pages
          keep_files: false
